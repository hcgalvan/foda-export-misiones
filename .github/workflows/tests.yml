name: Tests golden (motor de cálculo)

# Corre los tests de tests/calc.golden.test.mjs en cada push/PR, para
# cumplir el criterio de cierre de la Fase 2 del proyecto ("tests verdes
# en CI"). No tiene dependencias que instalar: usa el test runner
# incorporado de Node (node:test).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Correr tests golden del motor de cálculo
        run: node --test tests/*.mjs
